[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
bytes = "0.2.1"
futures = "0.2.0"
opentelemetrySemanticConventions = "0.1.2"
serde = "0.1.11"
serdeJson = "0.1.1"
tokio = "0.1.1"
tokioUtil = "0.1.0"
tracing = "0.1.0"
tracingOpentelemetry = "0.1.0"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
bytes = { module = "io.github.kotlinmania:bytes-kotlin", version.ref = "bytes" }
futures = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
opentelemetry-semantic-conventions = { module = "io.github.kotlinmania:opentelemetry-semantic-conventions-kotlin", version.ref = "opentelemetrySemanticConventions" }
serde = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
tokio = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }
tokio-util = { module = "io.github.kotlinmania:tokio-util-kotlin", version.ref = "tokioUtil" }
tracing = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }
tracing-opentelemetry = { module = "io.github.kotlinmania:tracing-opentelemetry-kotlin", version.ref = "tracingOpentelemetry" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }

[bundles]
rama-core-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "bytes",
  "futures",
  "opentelemetry-semantic-conventions",
  "serde",
  "serde-json",
  "tokio",
  "tokio-util",
  "tracing",
  "tracing-opentelemetry",
]
